# Most jobs run without Elektron bytes. `gates` downloads the 1.40C from
# Elektron's site (scripts/fetch-os.sh, zip hash pinned) into the runner's
# working tree on every run and runs `make reach RUN=1 KEEP=1`; the bytes are
# not cached, not uploaded as an artifact and not printed. It runs for pushes
# to main and for pull requests from this repository, not for fork PRs.
# Each job is one make target, so a red job reproduces with the same command.
# `classify` gates each job on whether the diff touches its inputs
# (tools/verify/ci_paths.py holds the map); it errs toward running: a
# workflow, Makefile or scripts change runs everything, and `make ci`
# locally still runs everything.
name: ✅ CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    # Which of the jobs below this diff can reach; a skipped job is a grey
    # check, not a pass. No usable diff (workflow_dispatch) -> everything.
    name: 🔍 Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coldfire: ${{ steps.map.outputs.coldfire }}
      dsp: ${{ steps.map.outputs.dsp }}
      acceptance: ${{ steps.map.outputs.acceptance }}
      reach: ${{ steps.map.outputs.reach }}
      site: ${{ steps.map.outputs.site }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 🔍 Detect Changed Paths
        id: map
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          python3 tools/verify/ci_paths.py --base "$base" --github-output >> "$GITHUB_OUTPUT"

  reach:
    # The gates this PR reaches, from its diff against the base branch
    # (tools/verify/reach.py), printed and not run. For fork PRs, which do
    # not get the firmware; the PR body lists each with its result from a
    # local run.
    name: 📋 Gates — Listed (Fork PRs)
    needs: classify
    if: >-
      github.event_name == 'pull_request'
      && needs.classify.outputs.reach == 'true'
      && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 📋 List Gates
        run: make reach BASE=origin/${{ github.base_ref }}

  gates:
    # make reach RUN=1 KEEP=1 against the stock 1.40C fetched into this
    # runner. No cache or upload step touches downloads/ or out/.
    name: 🧪 Gates — make reach
    needs: classify
    if: >-
      (github.event_name == 'push'
       || (github.event_name == 'pull_request'
           && github.event.pull_request.head.repo.full_name == github.repository))
      && needs.classify.outputs.reach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OS_HASH_STRICT: '1'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 💾 Restore Toolchain Cache
        id: m68k
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/m68k-elf
          key: m68k-elf-${{ runner.os }}-${{ hashFiles('scripts/m68k-toolchain.sh') }}

      # apt packages, the m68k toolchain (a no-op when restored), then setup.sh
      - name: 🚀 Install System Tools and Toolchain
        run: |
          echo "$HOME/.local/m68k-elf/bin" >> "$GITHUB_PATH"
          scripts/setup-linux.sh

      # saved when the toolchain is complete (libgcc is its last install step),
      # also after a later failure; a partial tree would be cached under the key for good
      - name: 🧮 Check Toolchain Complete
        id: m68k-done
        if: always()
        run: find ~/.local/m68k-elf -name libgcc.a 2>/dev/null | grep -q . && echo complete=true >> "$GITHUB_OUTPUT" || true

      - name: 💾 Save Toolchain Cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && steps.m68k.outputs.cache-hit != 'true' && steps.m68k-done.outputs.complete == 'true'
        with:
          path: ~/.local/m68k-elf
          key: m68k-elf-${{ runner.os }}-${{ hashFiles('scripts/m68k-toolchain.sh') }}

      - name: ⬇️ Fetch Stock OS
        run: make os

      - name: 🔬 Extract Main OS
        run: make recon

      - name: 📦 Install Remixer Dependencies
        run: pip install uv && make emu-setup

      - name: 🏗️ Build ColdFire Port
        run: make emu-cf

      - name: 🧪 Run Gates
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          make reach RUN=1 KEEP=1 BASE="$base"

  acceptance-runner:
    name: ✅ Acceptance Runner Tests (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.acceptance == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the runner tests load the registry, whose manifests read the author submodules (test_check_shards)
          submodules: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: ✅ Acceptance Runner Tests
        run: make test-acceptance

  docs:
    name: 📚 Docs and Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the rendered tables load the registry, whose manifests read the author submodules
          submodules: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # the manual site's pages include the generated reference files, so
      # they must exist before the doclinks scan of the tracked pages
      - name: 📝 Generate Pages
        run: python3 tools/site/gen_pages.py

      - name: 🔗 Verify Docs
        run: make verify-docs

  site:
    # The manual site builds with MkDocs shadcn: the generator runs the registry, and
    # mkdocs --strict fails on a bad manifest, a broken link or a broken
    # snippet include. The deploy is the Pages workflow on main; a PR
    # builds without deploying.
    name: 🌐 Manual Site Build
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the generator loads the registry, whose manifests read the author submodules
          submodules: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 📦 Install Site Dependencies
        run: pip install -r docs/site/requirements.txt

      - name: 📝 Generate Pages
        run: python3 tools/site/gen_pages.py

      - name: 🏗️ Build Site
        run: mkdocs build --strict --config-file docs/site/mkdocs.yml

  web-patches:
    # The web builder's committed patches (docs/site/builder/). Needs no
    # firmware: the manifest must match the patch files, and on main each
    # remix the code has moved past is reported as a warning. The patches are
    # rebuilt from a machine with the user's 1.40C: make webpatch BUILD=N.
    name: 🧩 Web Builder Patches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # the staleness check loads the registry, whose manifests read the author submodules
          submodules: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 🧩 Check Patch Manifest
        run: |
          if [ -f docs/site/builder/manifest.json ]; then
            python3 tools/web/stale.py --check
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then python3 tools/web/stale.py; fi
          else
            echo "no published patches yet"
          fi

  dsp-toolchain:
    name: 🎛️ DSP Toolchain — dsp56300 (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.dsp == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🎛️ Build and Test dsp56300
        run: make ci-dsp

  coldfire-port:
    name: 🔌 ColdFire Port Unit Tests (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.coldfire == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔌 Build and Test ColdFire Port
        run: make ci-emu
